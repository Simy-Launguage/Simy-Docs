name: Build & Deploy Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let one deployment finish at a time, but do not cancel a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Sets up Vite+ (vp), the Node.js runtime and the pnpm version declared
      # in package.json (`devEngines.packageManager`), then runs `vp install`.
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '24'
          cache: true

      # `vp run build` runs the `build` script from package.json:
      # `vitepress build docs` -> docs/.vitepress/dist
      - name: Build docs
        run: vp run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy
    needs: build
    # Only publish on the default branch (or a manual run), never on PRs.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
